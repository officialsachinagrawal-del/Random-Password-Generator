<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- bootstap css -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container w-50">

        <h1 id = "password-heading">Password Generator</h1>
        <input type ="Number" id = "Password-length" placeholder="Enter Length">
        <div class="button-container d-flex gap-3">
            <button  type = "button" class = "btn btn-primary mode-btn" id = "Weak-pass">Weak Password</button>
            <button  type = "button" class = "btn btn-success mode-btn" id = "Strong-pass">Strong Password</button>
            <button  type = "button" class = "btn btn-info    mode-btn" id = "Super-Str-pass">Super Strong Password</button>
            <button  type = "button" class = "btn btn-warning mode-btn" id = "Funny-pass">Funny Password</button>
        </div>

    </div>
    
   <!-- bootstap scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
